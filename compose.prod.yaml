# Production stack for a single VPS (Hetzner CX22 or similar).
# Builds the CURRENT checkout of main (the GHCR :latest image is stale, it only
# rebuilds on version tags), then fronts it with Caddy for automatic HTTPS.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Only Caddy is exposed to the internet; the app is reachable to Caddy only,
# over the compose network as app:8000 (see Caddyfile).
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      # format: raw disables compose's $-interpolation so minified ad
      # snippets containing $ are passed through byte-for-byte.
      - path: ./deploy/app.env
        format: raw
    expose:
      - "8000"
    volumes:
      # Local analytics SQLite file (ANALYTICS_DB_PATH=/data/analytics.db).
      # Named volumes survive `up -d --build`, so the DB outlives every deploy.
      - analytics_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # other sites' Caddy blocks, server-only (see Caddyfile)
      - ./sites:/etc/caddy/sites:ro
      # israfill.dev portfolio static build, served by the same Caddy
      - /opt/israfill.dev/dist:/srv/israfill:ro
      - /opt/unfollowfa.st/site:/srv/unfollowfast:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  analytics_data:
  caddy_data:
  caddy_config:
